---
# `locale` is passed to RenderCV as is. `site` names the locale on the website, in its own language, places it among
# the others and translates the website's interface.
site:
  name: Valencià
  order: 3
  strings:
    variant: Tipus
    language: Llengua
    download: Descarregar PDF

# RenderCV has no Catalan locale, so this one builds on the Spanish locale and overrides every text, following the
# norms of the Acadèmia Valenciana de la Llengua.
locale:
  language: spanish
  last_updated: Última actualització
  month: mes
  months: mesos
  year: any
  years: anys
  present: actualitat
  phrases:
    degree_with_area: DEGREE en AREA
  month_abbreviations:
    - Gen
    - Febr
    - Març
    - Abr
    - Maig
    - Juny
    - Jul
    - Ag
    - Set
    - Oct
    - Nov
    - Des
  month_names:
    - Gener
    - Febrer
    - Març
    - Abril
    - Maig
    - Juny
    - Juliol
    - Agost
    - Setembre
    - Octubre
    - Novembre
    - Desembre
