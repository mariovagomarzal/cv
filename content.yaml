      - name: '[Stemma](https://github.com/stemma-math/stemma-exedra)'
        start_date: 2026
        end_date: present
        summary:
          en: Open-source prototype of a collaborative platform where people and AI agents do mathematical research
            together, described in a preprint written with Enric Cosme Llópez.
          es: Prototipo de código abierto de una plataforma colaborativa en la que personas y agentes de IA hacen
            juntos investigación matemática, descrito en una prepublicación escrita con Enric Cosme Llópez.
          ca: Prototip de codi obert d'una plataforma col·laborativa en què persones i agents d'IA fan junts
            investigació matemàtica, descrit en una prepublicació escrita amb Enric Cosme Llópez.
      - name: '[A Formalization of Higher-Order Categories in Lean
          4](https://mariovagomarzal.github.io/higher_category_theory/)'
        start_date: 2025
        end_date: 2026
        summary:
          en: Final degree thesis formalizing higher-order categories in Lean 4, a generalization of category theory.
          es: Trabajo de fin de grado que formaliza las categorías de orden superior en Lean 4, una generalización de
            la teoría de categorías.
          ca: Treball de fi de grau que formalitza les categories d'ordre superior en Lean 4, una generalització de la
            teoria de categories.
        highlights:
          - en: Thesis and Lean code released openly, with a GitHub repository and a [DOI-archived deposit on
              Zenodo](https://doi.org/10.5281/zenodo.20631672).
            es: Memoria y código Lean publicados de forma abierta, con un repositorio en GitHub y un [depósito
              archivado con DOI en Zenodo](https://doi.org/10.5281/zenodo.20631672).
            ca: Memòria i codi Lean publicats de manera oberta, amb un repositori a GitHub i un [depòsit arxivat amb
              DOI a Zenodo](https://doi.org/10.5281/zenodo.20631672).

  publications:
    title: {en: Publications, es: Publicaciones, ca: Publicacions}
    entries:
      - title: A software infrastructure proposal for mathematical research with AI agents
        authors: [Mario Vago Marzal, Enric Cosme Llópez]
        date: 2026-11
        doi: 10.48550/arXiv.2611.11645
        journal:
          en: Preprint, arXiv:2611.11645 [math.HO]
          es: Prepublicación, arXiv:2611.11645 [math.HO]
          ca: Prepublicació, arXiv:2611.11645 [math.HO]
        summary:
          en: Proposes a self-hosted environment where research groups do their daily mathematical work together
            with AI agents, built on a small open core that records who did what and gives every result a stable
            address. Presents Stemma, an early prototype of the proposal.
          es: Propone un entorno autoalojado en el que los grupos de investigación hacen su trabajo matemático
            diario junto con agentes de IA, construido sobre un pequeño núcleo abierto que registra quién hizo qué y
            da a cada resultado una dirección estable. Presenta Stemma, un primer prototipo de la propuesta.
          ca: Proposa un entorn autoallotjat en què els grups d'investigació fan el seu treball matemàtic diari
            juntament amb agents d'IA, construït sobre un xicotet nucli obert que registra qui va fer què i dona a
            cada resultat una adreça estable. Presenta Stemma, un primer prototip de la proposta.
      - title: Higher-order many-sorted categorial algebras via generalized hep-derivors
        authors: [Juan Climent Vidal, Enric Cosme Llópez, Raúl Ruiz Mora, Mario Vago Marzal]
        date: 2026-11
        doi: 10.48550/arXiv.2611.03553
        journal:
          en: Preprint, arXiv:2611.03553 [math.CT]
          es: Prepublicación, arXiv:2611.03553 [math.CT]
          ca: Prepublicació, arXiv:2611.03553 [math.CT]
        summary:
          en: Studies many-sorted algebras whose carriers are strict higher-order categories, relating their
            homogeneous and heterogeneous presentations through generalized hep-derivors, with an equivalence in
            finite dimensions and the ω-dimensional case recovered as a limit of truncations.
          es: Estudia las álgebras *many-sorted* cuyos soportes son categorías estrictas de orden superior, y
            relaciona sus presentaciones homogénea y heterogénea mediante hep-derivors generalizados, con una
            equivalencia en dimensión finita y el caso ω-dimensional recuperado como límite de truncaciones.
          ca: Estudia les àlgebres *many-sorted* els suports de les quals són categories estrictes d'ordre superior,
            i relaciona les seues presentacions homogènia i heterogènia mitjançant hep-derivors generalitzats, amb
            una equivalència en dimensió finita i el cas ω-dimensional recuperat com a límit de truncacions.
      - title: '[A Formalization of Higher-Order Categories in Lean
          4](https://mariovagomarzal.github.io/higher_category_theory/)'
        authors: [Mario Vago Marzal]
        date: 2026
        doi: 10.5281/zenodo.20631672
        journal:
          en: Final degree thesis, Universitat de València. Supervised by Enric Cosme Llópez
          es: Trabajo de fin de grado, Universitat de València. Dirigido por Enric Cosme Llópez
          ca: Treball de fi de grau, Universitat de València. Dirigit per Enric Cosme Llópez
        summary:
          en: Formalizes in Lean 4 the single-sorted and the usual many-sorted notions of *n*-categories and
            ω-categories, and outlines the proof of their equivalence. The thesis and the Lean code are released
            openly.
          es: Formaliza en Lean 4 las nociones *single-sorted* y las *many-sorted* habituales de *n*-categoría y
            ω-categoría, y esboza la demostración de su equivalencia. La memoria y el código Lean se publican de forma
            abierta.
          ca: Formalitza en Lean 4 les nocions *single-sorted* i les *many-sorted* habituals de *n*-categoria i
            ω-categoria, i esbossa la demostració de la seua equivalència. La memòria i el codi Lean es publiquen de
            manera oberta.

