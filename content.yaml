          4](https://mariovagomarzal.github.io/higher_category_theory/)'
        authors: [Mario Vago Marzal]
        date: 2026
        doi: 10.5281/zenodo.20631672
        journal:
          en: Final degree thesis, Universitat de València. Supervised by Enric Cosme Llópez
          es: Trabajo de fin de grado, Universitat de València. Dirigido por Enric Cosme Llópez
          ca: Treball de fi de grau, Universitat de València. Dirigit per Enric Cosme Llópez
        summary:
          en: Formalizes in Lean 4 the single-sorted and the usual many-sorted notions of *n*-categories and
            ω-categories, and outlines the proof of their equivalence. The thesis and the Lean code are released
            openly.
          es: Formaliza en Lean 4 las nociones *single-sorted* y las *many-sorted* habituales de *n*-categoría y
            ω-categoría, y esboza la demostración de su equivalencia. La memoria y el código Lean se publican de forma
            abierta.
          ca: Formalitza en Lean 4 les nocions *single-sorted* i les *many-sorted* habituals de *n*-categoria i
            ω-categoria, i esbossa la demostració de la seua equivalència. La memòria i el codi Lean es publiquen de
            manera oberta.

