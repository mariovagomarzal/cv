sections:
  summary:
    title: {en: Summary, es: Resumen, ca: Resum}
    entries:
      - except: [academic]
        en: I am a mathematician from the Universitat de València, with a particular interest in mathematical
          formalization, scientific software and the application of AI to software development and to mathematical
          research. I combine a solid mathematical background with
          hands-on experience in Python and its scientific ecosystem, in Lean 4 and in computer-assisted theorem
          proving, alongside modern development tools such as Git, Nix and continuous integration.
        es: Soy matemático por la Universitat de València, con especial interés en la formalización matemática, el
          software científico y la aplicación de la IA al desarrollo de software y a la investigación matemática.
          Combino una sólida formación matemática con
          experiencia práctica en Python y su ecosistema científico, en Lean 4 y en la demostración de teoremas
          asistida por ordenador, junto con herramientas de desarrollo modernas como Git, Nix e integración continua.
        ca: Soc matemàtic per la Universitat de València, amb un interés especial en la formalització matemàtica, el
          programari científic i l'aplicació de la IA al desenvolupament de programari i a la investigació
          matemàtica. Combine una sòlida formació matemàtica amb
          experiència pràctica en Python i el seu ecosistema científic, en Lean 4 i en la demostració de teoremes
          assistida per ordinador, juntament amb eines de desenvolupament modernes com Git, Nix i la integració
          contínua.
      - only: [academic]
        en: I am a mathematician interested in the formalization of mathematics, type theory, programming language
          theory and category theory. In my final degree thesis I formalized higher-order categories in Lean 4. I am
          currently pursuing an MSc in Mathematical Research and working on tools that bring AI agents into
          mathematical research, together with proof assistants.
        es: Soy matemático, con interés en la formalización de las matemáticas, la teoría de tipos, la teoría de
          lenguajes de programación y la teoría de categorías. En mi trabajo de fin de grado formalicé las categorías
          de orden superior en Lean 4. Actualmente curso el Máster en Investigación Matemática y trabajo en
          herramientas que incorporan agentes de IA a la investigación matemática, junto con los asistentes de
          demostración.
        ca: Soc matemàtic, amb interés en la formalització de les matemàtiques, la teoria de tipus, la teoria de
          llenguatges de programació i la teoria de categories. En el meu treball de fi de grau vaig formalitzar les
          categories d'ordre superior en Lean 4. Actualment curse el Màster en Investigació Matemàtica i treballe en
          eines que incorporen agents d'IA a la investigació matemàtica, juntament amb els assistents de demostració.

