  summary:
    title: {en: Summary, es: Resumen, ca: Resum}
    entries:
      - en: I am a mathematician from the Universitat de València, with a particular interest in mathematical
          formalization, scientific software and developer tooling. I combine a solid mathematical background with
          hands-on experience in Python and its scientific ecosystem, in Lean 4 and in computer-assisted theorem
          proving, alongside modern development tools such as Git, Nix and continuous integration.
        es: Soy matemático por la Universitat de València, con especial interés en la formalización matemática, el
          software científico y las herramientas para desarrolladores. Combino una sólida formación matemática con
          experiencia práctica en Python y su ecosistema científico, en Lean 4 y en la demostración de teoremas
          asistida por ordenador, junto con herramientas de desarrollo modernas como Git, Nix e integración continua.
        ca: Soc matemàtic per la Universitat de València, amb un interés especial en la formalització matemàtica, el
          programari científic i les eines per a desenvolupadors. Combine una sòlida formació matemàtica amb
          experiència pràctica en Python i el seu ecosistema científic, en Lean 4 i en la demostració de teoremes
          assistida per ordinador, juntament amb eines de desenvolupament modernes com Git, Nix i la integració
          contínua.

