      - name: '[A Formalization of Higher-Order Categories in Lean
          4](https://mariovagomarzal.github.io/higher_category_theory/)'
        start_date: 2025
        end_date: 2026
        summary:
          en: Final degree thesis formalizing higher-order categories in Lean 4, a generalization of category theory.
          es: Trabajo de fin de grado que formaliza las categorías de orden superior en Lean 4, una generalización de
            la teoría de categorías.
          ca: Treball de fi de grau que formalitza les categories d'ordre superior en Lean 4, una generalització de la
            teoria de categories.
        highlights:
          - en: Thesis and Lean code released openly, with a GitHub repository and a [DOI-archived deposit on
              Zenodo](https://doi.org/10.5281/zenodo.20631672).
            es: Memoria y código Lean publicados de forma abierta, con un repositorio en GitHub y un [depósito
              archivado con DOI en Zenodo](https://doi.org/10.5281/zenodo.20631672).
