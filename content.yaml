  projects:
    title: {en: Projects, es: Proyectos, ca: Projectes}
    entries:
      - name: '[A Formalization of Higher-Order Categories in Lean 4](https://doi.org/10.5281/zenodo.20631672)'
        start_date: 2025
        end_date: 2026
        summary:
          en: Final degree thesis formalizing higher-order categories in Lean 4, a generalization of category theory.
          es: Trabajo de fin de grado que formaliza las categorías de orden superior en Lean 4, una generalización de
            la teoría de categorías.
          ca: Treball de fi de grau que formalitza les categories d'ordre superior en Lean 4, una generalització de la
            teoria de categories.
        highlights:
          - en: Thesis and Lean code released openly, with a GitHub repository and a DOI-archived deposit on Zenodo.
            es: Memoria y código Lean publicados de forma abierta, con un repositorio en GitHub y un depósito
              archivado con DOI en Zenodo.
            ca: Memòria i codi Lean publicats de manera oberta, amb un repositori a GitHub i un depòsit arxivat amb
              DOI a Zenodo.
        overrides:
          academic:
            highlights:
              - en: Supervised by Enric Cosme Llópez and Raúl Ruiz Mora.
                es: Dirigido por Enric Cosme Llópez y Raúl Ruiz Mora.
                ca: Dirigit per Enric Cosme Llópez i Raúl Ruiz Mora.
              - en: Formalizes the single-sorted notions of *n*-categories and ω-categories and proves their
                  equivalence with the usual many-sorted ones.
                es: Formaliza las nociones de un solo tipo de *n*-categoría y ω-categoría y demuestra su equivalencia
                  con las nociones multitipo habituales.
                ca: Formalitza les nocions d'un sol tipus de *n*-categoria i ω-categoria i en demostra l'equivalència
                  amb les nocions multitipus habituals.
              - en: Thesis and Lean code released openly, with a GitHub repository and a DOI-archived deposit on
                  Zenodo.
                es: Memoria y código Lean publicados de forma abierta, con un repositorio en GitHub y un depósito
                  archivado con DOI en Zenodo.
                ca: Memòria i codi Lean publicats de manera oberta, amb un repositori a GitHub i un depòsit arxivat
                  amb DOI a Zenodo.

