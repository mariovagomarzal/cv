---
# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json
# After quire, my Typst template for books and articles: EB Garamond with small caps, quiet sans-serif labels in
# Fira Sans, thin golden rules and generous margins. The section titles take the golden color of their rule, and
# `academic/SectionBeginning.j2.typ` keeps their text black.
design:
  theme: classic
  page:
    size: a4
    top_margin: 2.5cm
    bottom_margin: 2.5cm
    left_margin: 2.5cm
    right_margin: 2.5cm
  colors:
    body: '#000000'
    name: '#000000'
    headline: '#808080'
    connections: '#808080'
    section_titles: '#c9b896'
    links: '#1f4d7a'
    footer: '#808080'
    top_note: '#808080'
  typography:
    line_spacing: 0.6em
    alignment: justified
    font_family:
      body: EB Garamond
      name: EB Garamond
      headline: Fira Sans
      connections: Fira Sans
      section_titles: EB Garamond
    font_size:
      body: 11pt
      name: 26pt
      headline: 9pt
      connections: 8.5pt
      section_titles: 1.3em
    small_caps:
      name: true
    bold:
      name: false
      section_titles: false
  header:
    alignment: center
    space_below_name: 0.5cm
    space_below_headline: 0.5cm
    connections:
      phone_number_format: international
      show_icons: false
      display_urls_instead_of_usernames: true
      separator: '·'
  sections:
    show_time_spans_in: []
  section_titles:
    type: with_full_line
    line_thickness: 0.4pt
    space_above: 0.7cm
    space_below: 0.4cm
  templates:
    top_note: ''
    education_entry:
      degree_column: null
      main_column: "**INSTITUTION**, DEGREE_WITH_AREA\nSUMMARY\nHIGHLIGHTS"
