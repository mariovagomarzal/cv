---
# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json
# After quire, my Typst template for books and articles: EB Garamond with small caps, quiet labels in Fira Sans and
# thin golden rules. `academic.typ` holds the Typst rules and `academic/SectionBeginning.j2.typ` draws the rule under
# the section titles, which is why their type is `without_line`.
design:
  theme: classic
  page:
    size: a4
    top_margin: 1.8cm
    bottom_margin: 1.8cm
    left_margin: 1.8cm
    right_margin: 1.8cm
  colors:
    body: '#000000'
    name: '#000000'
    headline: '#808080'
    connections: '#808080'
    section_titles: '#c9b896'
    links: '#000000'
    footer: '#808080'
    top_note: '#808080'
  typography:
    line_spacing: 0.6em
    alignment: justified
    font_family:
      body: EB Garamond
      name: EB Garamond
      headline: Fira Sans
      connections: Fira Sans
      section_titles: EB Garamond
    font_size:
      body: 11pt
      name: 26pt
      headline: 9pt
      connections: 8.5pt
      section_titles: 1.3em
    small_caps:
      name: true
    bold:
      name: false
      section_titles: false
  header:
    alignment: center
    space_below_name: 0.5cm
    space_below_headline: 0.5cm
    connections:
      phone_number_format: international
  links:
    underline: true
    show_external_link_icon: true
  sections:
    show_time_spans_in: []
  section_titles:
    type: without_line
    line_thickness: 0.5pt
    space_above: 0.7cm
    space_below: 0.4cm
  templates:
    top_note: ''
    education_entry:
      degree_column: null
      main_column: "**INSTITUTION**, DEGREE_WITH_AREA\nSUMMARY\nHIGHLIGHTS"
